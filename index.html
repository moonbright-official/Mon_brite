/* === Premium All Anime Page Enhancements === */
/* Skeleton loading */
.skeleton-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.skeleton-card__poster{aspect-ratio:2/3;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skeleton-card__line{height:13px;margin:8px 10px;border-radius:4px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skeleton-card__line--sm{width:60%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}

/* Glassmorphism filter bar */
.filter-bar{position:sticky;top:56px;z-index:50;background:rgba(8,8,15,.88);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-bottom:1px solid var(--border);padding:10px 0;margin:0 -20px 20px;padding-left:20px;padding-right:20px}
.filter-bar__inner{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filter-bar__inner::-webkit-scrollbar{display:none}
.filter-bar__chip{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-bar__chip:hover{border-color:var(--border-bright);color:var(--text)}
.filter-bar__chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:var(--accent);box-shadow:0 2px 12px var(--accent-glow)}
.filter-bar__sort{flex-shrink:0;margin-left:auto}

/* Enhanced hero — stronger gradient */
.home-hero{box-shadow:0 20px 60px #00000099}
.home-hero__btn--watch{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 4px 20px var(--accent-glow)}
.home-hero__btn--list{background:rgba(255,255,255,.15);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.25)}

/* Premium card glow on hover */
.anime-card:hover{transform:translateY(-8px)}
.anime-card:hover .anime-card__poster{border-color:var(--accent-glow);box-shadow:0 16px 40px #00000099,0 0 24px var(--accent-glow)}
.anime-card__poster{aspect-ratio:2/3!important;height:auto!important;min-height:0!important;overflow:hidden;background:#111!important}
.anime-card__poster img{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important;object-position:center center!important;background:#111;transition:transform .25s ease}
.anime-card:hover .anime-card__poster img{transform:scale(1.02)}

/* Category section header improvements */
.hscroll-title{display:flex;align-items:center;gap:8px}

/* Responsive grid: 2 col mobile, 5-7 col desktop */
.anime-grid{gap:16px}
@media(min-width:768px){.anime-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
@media(min-width:1024px){.anime-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}}
@media(min-width:1280px){.anime-grid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:1536px){.anime-grid{grid-template-columns:repeat(7,1fr)}}

/* Load more button */
.load-more-btn{display:block;margin:24px auto;padding:12px 36px;background:var(--surface);border:1px solid var(--border-bright);border-radius:24px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.load-more-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.load-more-btn:disabled{opacity:.5;cursor:default}

/* MoonBright v2.4 — real full-width trending hero carousel */
.home-hero{position:relative;overflow:hidden;isolation:isolate;touch-action:pan-y;cursor:default}
.home-hero__track{position:absolute;inset:0;width:100%;height:100%;display:flex;overflow:visible;transform:translate3d(0,0,0);transition:transform .48s cubic-bezier(.22,.61,.36,1);will-change:transform;z-index:1}
.home-hero__slide{position:relative;display:block;flex:0 0 100%;width:100%;height:100%;min-width:100%;min-height:100%;overflow:hidden}
.home-hero__slide .home-hero__bg{position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center top;z-index:0}
.home-hero__slide .home-hero__content{position:absolute;left:0;right:0;bottom:0;z-index:2}
.home-hero__dots{z-index:20}
.home-hero__dot{pointer-events:auto}
.home-hero__swipe{display:none}
.home-hero.is-dragging .home-hero__track{transition:none}
.home-hero.is-dragging{cursor:grabbing}
@media(max-width:520px){.home-hero{min-height:570px}.home-hero__slide .home-hero__content{bottom:0}}

/* Crunchyroll-style trending banner refresh */
.home-hero__meta-item{font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
.home-hero__actions{margin-top:2px}
.home-hero__btn--watch{flex:1;max-width:280px;justify-content:center;font-size:15px;padding:13px 22px}
@media(max-width:768px){
.home-hero{margin-left:-16px;margin-right:-16px;width:calc(100% + 32px);border-radius:0;box-shadow:none}
.home-hero__btn--watch{max-width:none}
}

/* === Bottom Watch Bar (v2.7.2) === */
.mb-watchbar{position:fixed;bottom:0;left:0;right:0;z-index:300;background:linear-gradient(180deg,rgba(10,10,16,0) 0%,rgba(10,10,16,.97) 25%,#0a0a10 100%);padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;}
.mb-watchbar__btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:15px 24px;font-size:15px;font-weight:700;font-family:var(--font-display);cursor:pointer;transition:transform .12s;}
.mb-watchbar__btn:active{transform:scale(.97);}
.mb-watchbar__btn svg{width:20px;height:20px;flex-shrink:0;}
.mb-watchbar__save{width:50px;height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:transform .12s;}
.mb-watchbar__save:active{transform:scale(.95);}
.mb-watchbar__save svg{width:22px;height:22px;fill:none;stroke:var(--text-dim);}
.mb-watchbar__save.saved{background:rgba(255,138,61,.15);border-color:var(--accent);}
.mb-watchbar__save.saved svg{fill:var(--accent);stroke:var(--accent);}
body.mb-has-watchbar .bottom-nav{display:none !important;}
body.mb-has-watchbar .view{padding-bottom:90px !important;}

/* === Battery Optimization CSS (v2.8.0) === */
@media (prefers-reduced-motion: reduce){
*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
.splash__flash{display:none !important;}
.splash__shockwave{display:none !important;}
.splash__sweep{display:none !important;}
.splash__logo-wrap{animation:none !important;}
}
/* Pause GPU-heavy animations when not visible */
.home-hero[data-current]{will-change:auto;}
.anime-card{content-visibility:auto;contain-intrinsic-size:160px 240px;}
.hscroll-card{content-visibility:auto;contain-intrinsic-size:140px 200px;}
/* Reduce backdrop-filter on low-end */
@media (max-width:480px){
.bottom-nav{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}
.login-box,.fullsearch-overlay{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}
}
/* Splash stars: reduce count via CSS on mobile */
@media (max-width:480px){

}

/* === Full-screen Season Selector (v2.8.3) === */
.mb-season-overlay{position:fixed;inset:0;z-index:400;background:#0a0a10;display:flex;flex-direction:column;animation:mbFadeIn .2s ease;}
.mb-season-overlay__header{display:flex;align-items:center;gap:14px;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top));border-bottom:1px solid var(--border);}

.cb-detail{position:fixed;inset:0;z-index:250;background:#0a0a10;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.cb-detail__topbar{position:fixed;top:0;left:0;right:0;z-index:260;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,transparent 100%);}

.cb-detail__rating-text{font-size:13px;color:var(--text-dim);}

.cb-detail__action-icon{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;background:rgba(255,106,0,.1);transition:transform .12s;}.cb-detail__action:active .cb-detail__action-icon{transform:scale(.9);}

/* === Crunchyroll-style Home (v3.0.0) === */
.cr-home{background:#0d0d0f;min-height:100vh;}
.cr-topbar{position:sticky;top:0;z-index:100;background:#0d0d0f;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));}
.cr-topbar__logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--accent);font-family:var(--font-display);letter-spacing:-.5px;}
.cr-topbar__logo svg{width:28px;height:28px;}
.cr-topbar__icons{display:flex;gap:12px;}
.cr-topbar__icons button{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;}

.cr-hero{position:relative;width:100%;height:58vh;min-height:340px;overflow:hidden;}

.cr-hero__overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.4) 40%,rgba(0,0,0,.85) 75%,#000 100%);}
.cr-hero__content{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;}
.cr-hero__badge{font-size:11px;color:rgba(255,255,255,.7);margin-bottom:4px;text-transform:capitalize;}
.cr-hero__title{font-size:22px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
.cr-hero__meta{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:10px;}
.cr-hero__synopsis{font-size:13px;color:rgba(255,255,255,.7);line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cr-hero__actions{display:flex;align-items:center;gap:10px;}
.cr-hero__btn{flex:1;max-width:300px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:24px;padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .12s;}
.cr-hero__btn:active{transform:scale(.97);}
.cr-hero__btn svg{width:20px;height:20px;flex-shrink:0;}
.cr-hero__save{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;cursor:pointer;}
.cr-hero__save svg{width:22px;height:22px;color:#fff;}
.cr-hero__save.saved{background:var(--accent);}
.cr-hero__dots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:3;}
.cr-hero__dot{width:24px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);border:none;cursor:pointer;transition:all .2s;}

/* === Progress-aware watch helpers (v2.7) === */
function mbGetEpRow(animeId, epIdx){
  var a = ANIME_DATA.find(function(x){return x.id===animeId});
  if(!a||!a.episodes_list)return null;
  return a.episodes_list[epIdx]||null;
}
/* Return the episode index that the user should "continue" from for a given anime */
function mbContinueEpIdx(animeId){
  var a = ANIME_DATA.find(function(x){return x.id===animeId});
  if(!a||!a.episodes_list||!a.episodes_list.length)return 0;
  /* Priority: if user just clicked an episode, return that */
  if(state._lastClickedEp && state._lastClickedEp.animeId === animeId){
    return state._lastClickedEp.epIdx;
  }
  var wp = state.watchProgress||{};
  var bestIdx = -1, bestTs = 0;
  for(var i=0;i<a.episodes_list.length;i++){
    var key = animeId+'_'+i;
    var p = wp[key];
    if(p && p.position>5 && (p.ts||0) > bestTs){
      bestTs = p.ts||0;
      bestIdx = i;
    }
  }
  if(bestIdx < 0)return 0;
  var bestProg = wp[animeId+'_'+bestIdx];
  var isDone = bestProg && bestProg.duration>0 && bestProg.position>=(bestProg.duration-15);
  if(isDone){
    var nxt = bestIdx + 1;
    return nxt < a.episodes_list.length ? nxt : bestIdx;
  }
  return bestIdx;
}
/* Label for the watch button based on progress */
function mbWatchLabel(animeId){
  var a = ANIME_DATA.find(function(x){return x.id===animeId});
  if(!a||!a.episodes_list||!a.episodes_list.length)return {label:'Start Watching E1', idx:0, mode:'start'};
  var wp = state.watchProgress||{};
  /* Priority 1: If user just clicked a specific episode, show THAT episode */
  if(state._lastClickedEp && state._lastClickedEp.animeId === animeId){
    var clickIdx = state._lastClickedEp.epIdx;
    var clickProg = wp[animeId+'_'+clickIdx];
    /* If the clicked episode is completed, show "Next" */
    if(clickProg && clickProg.duration>0 && clickProg.position>=(clickProg.duration-15)){
      var nxt = clickIdx + 1;
      if(nxt < a.episodes_list.length){
        return {label:'Next E'+(nxt+1), idx:nxt, mode:'next'};
      }
      return {label:'Replay E'+(clickIdx+1), idx:clickIdx, mode:'replay'};
    }
    /* If the clicked episode is partial, show "Continue" for it */
    if(clickProg && clickProg.position>5){
      return {label:'Continue E'+(clickIdx+1), idx:clickIdx, mode:'resume'};
    }
    /* User clicked but hasn't watched yet -> show "Watch E" for it */
    return {label:'Watch E'+(clickIdx+1), idx:clickIdx, mode:'start'};
  }
  /* Priority 2: No explicit click - find most recently watched by timestamp */
  var bestIdx = -1, bestTs = 0;
  for(var i=0;i<a.episodes_list.length;i++){
    var key = animeId+'_'+i;
    var p = wp[key];
    if(p && p.position>5 && (p.ts||0) > bestTs){
      bestTs = p.ts||0;
      bestIdx = i;
    }
  }
  /* No progress at all */
  if(bestIdx < 0)return {label:'Start Watching E1', idx:0, mode:'start'};
  var prog = wp[animeId+'_'+bestIdx];
  var isDone = prog && prog.duration>0 && prog.position>=(prog.duration-15);
  if(isDone){
    var nxt2 = bestIdx + 1;
    if(nxt2 < a.episodes_list.length){
      return {label:'Next E'+(nxt2+1), idx:nxt2, mode:'next'};
    }
    return {label:'Replay E'+(bestIdx+1), idx:bestIdx, mode:'replay'};
  }
  return {label:'Continue E'+(bestIdx+1), idx:bestIdx, mode:'resume'};
}
/* Mark an episode fully watched (used when playback ends) */
function mbMarkComplete(animeId, epIdx, dur){
  var key = animeId+'_'+epIdx;
  if(!state.watchProgress)state.watchProgress={};
  state.watchProgress[key] = {animeId:animeId, epIdx:epIdx, position: dur||0, duration: dur||0, ts:Date.now(), completed:true};
  if(_saveLocalTimer){clearTimeout(_saveLocalTimer)}
  saveLocal();
  saveLocalBackup();
  if(cloudReady && state.currentUserId){
    try{ cloudSave('progress', state.currentUserId+'_'+key, state.watchProgress[key]); }catch(e){}
  }
}
/* Cloud-save watch progress for current user */
function mbCloudSaveProgress(){
  if(!cloudReady || !state.currentUserId)return;
  if(!state.watchProgress)return;
  var batch = {};
  Object.keys(state.watchProgress).forEach(function(k){
    var p = state.watchProgress[k];
    if(p && p.position>0) batch[k] = p;
  });
  try{ cloudSave('progress', state.currentUserId, batch); }catch(e){}
}

/* Called when the current episode video ends (state 0) */
function mbOnEpisodeEnded(){
  if(!state._epCtx)return;
  try{
    var dur = state._ytPlayer ? state._ytPlayer.getDuration() : 0;
    mbMarkComplete(state._epCtx.animeId, state._epCtx.epIdx, dur);
  }catch(e){}
  /* Find next episode and show overlay */
  var a = ANIME_DATA.find(function(x){return x.id===state._epCtx.animeId});
  if(!a||!a.episodes_list)return;
  var nxt = state._epCtx.epIdx + 1;
  if(nxt >= a.episodes_list.length)return; /* no next episode */
  var ep = a.episodes_list[nxt];
  if(!ep)return;
  var srcs = epGetSources(ep);
  if(!srcs.length)return;
  /* Build overlay */
  var stage = document.getElementById('epvpStage');
  if(!stage)return;
  var old = document.getElementById('mbNextOverlay');
  if(old)old.remove();
  var ov = document.createElement('div');
  ov.id = 'mbNextOverlay';
  ov.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:20px;text-align:center;';
  ov.innerHTML = '<div style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">Up Next</div>'
    + '<div style="font-size:17px;font-weight:700;color:#fff;margin-bottom:18px;max-width:320px;">E'+(ep.num|| (nxt+1))+': '+(ep.title||('Episode '+(nxt+1)))+'</div>'
    + '<button id="mbPlayNext" style="background:var(--accent);color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>Play Next</button>'
    + '<button id="mbStayHere" style="margin-top:10px;background:transparent;color:var(--text-dim);border:none;font-size:13px;cursor:pointer;">Stay here</button>';
  stage.appendChild(ov);
  document.getElementById('mbPlayNext').onclick = function(){
    ov.remove();
    openEpisodePlayer(state._epCtx.animeId, nxt);
  };
  document.getElementById('mbStayHere').onclick = function(){ ov.remove(); };
  /* Auto-play next after 5 seconds */
  state._mbNextTimer = setTimeout(function(){
    if(document.getElementById('mbNextOverlay')){
      ov.remove();
      openEpisodePlayer(state._epCtx.animeId, nxt);
    }
  }, 5000);
}

/* === Full-screen Season Selector (v2.8.3) === */
function mbOpenSeasonOverlay(animeId){
  var a = ANIME_DATA.find(function(x){return x.id===animeId});
  if(!a||!a.episodes_list)return;
  /* Group episodes by season */
  var seas={};
  a.episodes_list.forEach(function(ep,idx){
    var s=ep.season||"1";
    if(!seas[s])seas[s]={count:0,firstIdx:idx};
    seas[s].count++;
  });
  var skeys=Object.keys(seas).sort(function(a,b){return parseInt(a)-parseInt(b)});
  if(skeys.length<=1){
    /* Only 1 season - no overlay needed, but still show it for consistency */
  }
  /* Get current season */
  var currentSk = skeys[0];
  var sel = document.getElementById('ep-season-select');
  if(sel) currentSk = sel.value;
  
  /* Remove existing overlay */
  var old = document.getElementById('mbSeasonOverlay');
  if(old) old.remove();
  
  /* Build overlay */
  var ov = document.createElement('div');
  ov.id = 'mbSeasonOverlay';
  ov.className = 'mb-season-overlay';
  var html = '';
  html += '<div class="mb-season-overlay__header">';
  html += '<button class="mb-season-overlay__close" onclick="mbCloseSeasonOverlay()"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>';
  html += '<div class="mb-season-overlay__title">Seasons</div>';
  html += '</div>';
  html += '<div class="mb-season-overlay__list">';
  skeys.forEach(function(sk){
    var isActive = sk === currentSk;
    var epCount = seas[sk].count;
    html += '<div class="mb-season-item'+(isActive?' active':'')+'" onclick="mbSelectSeason(\''+animeId+'\',\''+sk+'\')">';
    html += '<div class="mb-season-item__info">';
    html += '<div class="mb-season-item__name">Season '+sk+'</div>';
    html += '<div class="mb-season-item__count">'+epCount+' Episode'+(epCount>1?'s':'')+'</div>';
    html += '</div>';
    if(isActive){
      html += '<svg class="mb-season-item__check" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>';
    }
    html += '</div>';
  });
  html += '</div>';
  ov.innerHTML = html;
  document.body.appendChild(ov);
}
function mbCloseSeasonOverlay(){
  var ov = document.getElementById('mbSeasonOverlay');
  if(ov) ov.remove();
}
function mbSelectSeason(animeId, sk){
  /* Switch season */
  epvpSwitchSeason(sk);
  /* Update the button label */
  var btn = document.querySelector('[onclick^="mbOpenSeasonOverlay"]');
  if(btn){
    var span = btn.querySelector('span');
    if(span) span.textContent = 'Season ' + sk;
  }
  /* Close overlay */
  mbCloseSeasonOverlay();
}

/* === Battery Optimization Functions (v2.8.0) === */
var _fbUnsub = [];
var _fbPaused = false;
function mbPauseFirebase(pause){
  if(pause === _fbPaused) return;
  _fbPaused = pause;
  if(pause){
    /* Unsubscribe from Firebase realtime listeners to save battery */
    _fbUnsub.forEach(function(unsub){ try{ unsub(); }catch(e){} });
    _fbUnsub = [];
    console.log("Firebase listeners paused (battery save)");
  } else {
    /* Resume Firebase listeners */
    if(cloudReady) startRealtimeBatteryAware();
    console.log("Firebase listeners resumed");
  }
}
/* Throttle wrapper for expensive functions */
function mbThrottle(fn, wait){
  var last = 0, timer = null;
  return function(){
    var ctx = this, args = arguments, now = Date.now();
    if(timer){ clearTimeout(timer); }
    var remaining = wait - (now - last);
    if(remaining <= 0){
      last = now; fn.apply(ctx, args);
    } else {
      timer = setTimeout(function(){ last = Date.now(); fn.apply(ctx, args); }, remaining);
    }
  };
}

function mbLoadCloudProgress(){
  if(!cloudReady||!state.currentUserId)return;
  try{
    db.collection('progress').doc(state.currentUserId).get().then(function(doc){
      if(!doc.exists)return;
      var cloudData = doc.data();
      if(!cloudData)return;
      /* Merge: local data takes priority, fill gaps from cloud */
      if(!state.watchProgress)state.watchProgress={};
      Object.keys(cloudData).forEach(function(k){
        if(!state.watchProgress[k] && cloudData[k]){
          state.watchProgress[k]=cloudData[k];
        }
      });
      saveLocal();
      saveLocalBackup();
      render();
    }).catch(function(e){console.warn('Cloud progress load failed:',e);});
  }catch(e){console.warn('Cloud progress error:',e);}
}

/* === Cloud Auto-Cleanup: Delete data older than 3 months === */
function cleanupOldCloudData(){
if(!cloudReady)return;
var threeMonthsAgo=Date.now()-(90*24*60*60*1000);
/* Reviews and Users/accounts are NEVER deleted - only temporary data */
var collections=["comments","votes","favorites","activity","progress"];
collections.forEach(function(col){
db.collection(col).get().then(function(snap){
snap.forEach(function(doc){
var d=doc.data();
var ts=d.ts||d.createdAt||0;
/* If createdAt is ISO string, convert to timestamp */
if(typeof ts==="string"){ts=new Date(ts).getTime()||0}
if(ts>0&&ts<threeMonthsAgo){
doc.ref.delete().catch(function(e){console.warn("Cleanup delete failed:",e)});
}
});
console.log("Cleaned up old data from",col);
}).catch(function(e){console.warn("Cleanup error for",col,e)});
});
}

/* === Restore from Local Storage if cloud fails === */
function restoreFromLocal(){
try{
var b=localStorage.getItem("moonbright_backup");
if(!b)return false;
var data=JSON.parse(b);
if(data.reviews)state.reviews=data.reviews;
if(data.comments)state.comments=data.comments;
if(data.votes)state.votes=data.votes;
if(data.favorites)state.favorites=data.favorites;
if(data.activity)state.activity=data.activity;
if(data.viewHistory)state.viewHistory=data.viewHistory;
if(data.searchHistory)state.searchHistory=data.searchHistory;
if(data.watchProgress)state.watchProgress=data.watchProgress;
if(data.users)Object.assign(USERS,data.users);
console.log("Restored from local backup:",data.reviews.length,"reviews");
return true;
}catch(e){console.warn("Restore failed:",e);return false}
}

function tgCacheExtract(tgUrl,cacheKey,cb){
  var tm=tgUrl.match(/t\.me\/([\w]+)\/(\d+)/);
  if(!tm){cb('');return}
  var channel=tm[1];var postId=parseInt(tm[2]);
  var botToken='';
  try{botToken=state.appSettings&&state.appSettings.tgBotToken||localStorage.getItem('tg_bot_token')||''}catch(e){}
  if(botToken){
    var apiBase='https://api.telegram.org/bot'+botToken;
    /* Step 1: forwardMessage to channel to get file_id */
    fetch(apiBase+'/forwardMessage?chat_id=@'+channel+'&from_chat_id=@'+channel+'&message_id='+postId).then(function(r){return r.json()}).then(function(data){
      if(!data.ok){cb('');return}
      var fileId='';
      var fileSize=0;
      if(data.result&&data.result.video){fileId=data.result.video.file_id;fileSize=data.result.video.file_size||0}
      else if(data.result&&data.result.document){fileId=data.result.document.file_id;fileSize=data.result.document.file_size||0}
      else if(data.result&&data.result.animation){fileId=data.result.animation.file_id;fileSize=data.result.animation.file_size||0}
      if(!fileId){cb('');return}
      /* Delete the forwarded message to keep channel clean */
      if(data.result&&data.result.message_id){
        fetch(apiBase+'/deleteMessage?chat_id=@'+channel+'&message_id='+data.result.message_id).catch(function(){})
      }
      /* Step 2: Try getFile */
      fetch(apiBase+'/getFile?file_id='+fileId).then(function(r){return r.json()}).then(function(fdata){
        if(fdata.ok&&fdata.result&&fdata.result.file_path){
          var dlUrl=apiBase+'/file/'+fdata.result.file_path;
          cb(dlUrl);
        }else{
          /* File too big (>20MB) for Bot API — use embed iframe fallback */
          cb('IFRAME:'+tgUrl);
        }
      }).catch(function(){cb('IFRAME:'+tgUrl)});
    }).catch(function(){cb('')});
  }else{
    /* No bot token — use embed iframe */
    cb('IFRAME:'+tgUrl);

function forgotPassword(){
  playClickSound();
  if(!auth||!cloudReady){mbAlert("Firebase not connected. Password reset needs Firebase. Error: "+(cloudError||"Firebase not initialized"),"Error","error");return}
  mbPromptText("Enter your email address to receive a password reset link.","Reset Password","your@email.com",function(email){
    if(!email||email.trim().length<5||email.indexOf("@")<0){
      if(email!==null)mbAlert("Please enter a valid email address.","Invalid","warning");
      return;
    }
    var userEmail=email.trim();
    mbAlert("Sending password reset email to "+userEmail+"... Please wait.","Sending","info");
    var apiKey=firebase.app().options.apiKey;
    fetch("https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key="+apiKey,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({requestType:"PASSWORD_RESET",email:userEmail})
    }).then(function(r){return r.json()})
    .then(function(data){
      if(data.error){
        var msg=data.error.message||"Unknown error";
        console.error("Password reset REST API error:",data.error);
        if(msg.indexOf("EMAIL_NOT_FOUND")>=0){
          mbAlert("This email is NOT registered! Please sign up with "+userEmail+" first, then use forgot password.","Email Not Registered","error");
        }else if(msg.indexOf("TOO_MANY_ATTEMPTS")>=0){
          mbAlert("Too many attempts. Please try again later.","Rate Limited","error");
        }else{
          mbAlert("Could not send reset email. Error: "+msg+" Code: "+(data.error.code||"unknown"),"Error","error");
        }
      }else{
        mbAlert("Password reset link sent to "+userEmail+"! Check your inbox AND spam folder. Email from: noreply@moon-bright-anime.firebaseapp.com","Reset Link Sent","success");
      }
    }).catch(function(fetchErr){
      console.error("Password reset fetch error:",fetchErr);
      auth.sendPasswordResetEmail(userEmail).then(function(){
        mbAlert("Password reset link sent to "+userEmail+". Check inbox and spam folder.","Reset Link Sent","success");
      }).catch(function(e){
        mbAlert("Could not send reset email. Error: "+(e.message||e.code||"unknown")+". Make sure you signed up with this email first.","Error","error");
      });
    });
  });
}

function accChangeUsername(){
  if(!state.isLoggedIn||!state.currentUserId){accToast('Please log in first');return}
  var u=USERS[state.currentUserId];
  if(!u){accToast('User not found');return}
  mbPromptText('Enter new username (min 2 characters):','Change Username','New username',function(nn){

    if(nn.length<2){mbAlert('Username must be at least 2 characters','Too Short','warning');return}
    var newId='l_'+nn.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(newId!==state.currentUserId&&USERS[newId]){mbAlert('Username already taken','Exists','warning');return}
    var oldId=state.currentUserId;
    USERS[newId]={...u,id:newId,username:nn};
    delete USERS[oldId];
    state.currentUserId=newId;
    state.profileUserId=newId;
    saveLocal();
    cloudSave('users',newId,USERS[newId]);
    cloudDelete('users',oldId);
    mbAlert('Username changed successfully!','Done','success');
    render();
  });
}

function accDeleteAccount(){
  mbConfirm('Delete your account permanently? This CANNOT be undone.','Delete Account','danger',function(){
  mbConfirm('Are you absolutely sure? All your reviews, favorites, comments and data will be erased forever.','Final Warning','danger',function(){
  var uid=state.currentUserId;
  if(!uid){accToast('Not logged in');return}
  /* Delete user's data from cloud */
  if(cloudReady){
    /* Delete user profile */
    cloudDelete('users',uid);
    /* Delete user's reviews */
    state.reviews.filter(function(r){return r.userId===uid}).forEach(function(r){cloudDelete('reviews',r.id)});
    /* Delete user's comments */
    state.comments.filter(function(c){return c.userId===uid}).forEach(function(c){cloudDelete('comments',c.id)});
    /* Delete user's votes */
    state.votes.filter(function(v){return v.userId===uid}).forEach(function(v){cloudDelete('votes',v.reviewId+'_'+uid)});
    /* Delete user's favorites */
    state.favorites.filter(function(f){return f.userId===uid}).forEach(function(f){cloudDelete('favorites',uid+'_'+f.animeId)});
    /* Delete user's progress */
    cloudDelete('progress',uid);
  }
  /* Delete from local state */
  if(USERS[uid])delete USERS[uid];
  state.reviews=state.reviews.filter(function(r){return r.userId!==uid});
  state.comments=state.comments.filter(function(c){return c.userId!==uid});
  state.votes=state.votes.filter(function(v){return v.userId!==uid});
  state.favorites=state.favorites.filter(function(f){return f.userId!==uid});
  /* Clear local storage */
  localStorage.removeItem('moonbright_login');
  localStorage.removeItem('moonbright_data');
  /* Clear state */
  state.isLoggedIn=false;
  state.currentUserId=null;
  state.profileUserId=null;
  state.isBrowsingAsGuest=false;
  isAdmin=false;
  /* Sign out from Firebase */
  if(auth&&auth.currentUser){
    auth.currentUser.delete().then(function(){
      accToast('Account permanently deleted');
      navigate('home');
    }).catch(function(e){
      console.warn('Firebase account delete failed:',e);
      /* Even if Firebase delete fails, local data is cleared */
      auth.signOut().then(function(){navigate('home')});
      accToast('Account deleted');
    });
  }else{
    accToast('Account deleted');
    navigate('home');
  }
  });
  });

if(a.genres){

if(gi>=0)score+=genreCount[g]*(5-gi);
});
}
/* Boost by rating */

/* Boost ongoing anime */
if(a.status==='ongoing')score+=2;
/* Boost if title matches any search */
sh.forEach(function(s){

});
return{anime:a,score:score};
});

function crHeroAttachSwipe(){

  var sx=0,sy=0,hasMoved=false,locked=false;
  
  el.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;

    track.style.transition='none';
  },{passive:true});

    if(e.touches.length!==1||locked)return;

  },{passive:false});

    }

  },{passive:true});

    track.style.transition='none';

      var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){
        hasMoved=true;
        var pct=(dx/window.innerWidth)*100;
        var base=-crHeroIdx*100;
        track.style.transform='translate3d('+(base+pct)+'%,0,0)';
      }
    };

        }else{crHeroSlide(crHeroIdx);}
      }
      crHeroStart();
      document.removeEventListener('mousemove',moveHandler);
      document.removeEventListener('mouseup',upHandler);
    };
    document.addEventListener('mousemove',moveHandler);
    document.addEventListener('mouseup',upHandler);
    e.preventDefault();
  });
}

            db.collection('user_activity').doc(state.currentUserId).set({

              lastUpdated: Date.now()
            }, {merge: true}).catch(function(e){});
          }
        }catch(e){}
      }, 2000);
      
      return entry;
    }catch(e){ return null; }
  }
  
  /* Load activities from cloud */
  function loadActivityFromCloud(){
    try{
      if(typeof cloudReady !== 'undefined' && cloudReady && typeof db !== 'undefined' && db){
        db.collection('user_activity').get().then(function(snap){
          snap.forEach(function(doc){
            var d = doc.data();
            if(d.activities){
              d.activities.forEach(function(a){
                if(!state.userActivity.find(function(e){return e.id === a.id;})){
                  state.userActivity.push(a);
                }
              });
            }
          });
          /* Sort by timestamp descending */
          state.userActivity.sort(function(a,b){return b.ts - a.ts;});
          if(state.userActivity.length > 500) state.userActivity = state.userActivity.slice(0, 500);
          try{ localStorage.setItem('mb_user_activity', JSON.stringify(state.userActivity)); }catch(e){}
        }).catch(function(e){});
      }
    }catch(e){}
  }
  
  /* Load from localStorage */
  try{
    var saved = localStorage.getItem('mb_user_activity');
    if(saved){
      var parsed = JSON.parse(saved);
      if(parsed && parsed.length) state.userActivity = parsed;
    }
  }catch(e){}
  
  loadActivityFromCloud();
  
  /* Hook 1: Track poster/anime clicks */
  var _origNavigate = window.navigate;
  if(_origNavigate){
    window.navigate = function(view, animeId){
      try{
        if(view === 'anime' && animeId && state.currentUserId){
          var anime = null;
          if(typeof ANIME_DATA !== 'undefined'){
            anime = ANIME_DATA.find(function(a){return a.id === animeId;});
          }
          /* Find which poster variant was shown to this user */
          var variant = 0;
          if(typeof _getUserPosterType === 'function'){
            var pt = _getUserPosterType();
            if(pt !== null) variant = pt;
            else {
              var abKey = 'ab_poster_' + animeId;
              var saved = localStorage.getItem(abKey);
              if(saved !== null) variant = parseInt(saved);
            }
          } else {
            var abKey = 'ab_poster_' + animeId;
            var saved = localStorage.getItem(abKey);
            if(saved !== null) variant = parseInt(saved);
          }

          /* If anime has multiple posters, lock this variant as user's preference */
          if(anime && anime.posters && anime.posters.length > 0){
            var label = ['Romance','Action','Family','School'][variant] || 'Main';
            trackActivity('poster_click', {
              animeId: animeId,
              animeTitle: anime ? anime.title : animeId,
              view: view,
              posterVariant: variant,
              posterLabel: label,
              totalVariants: anime.posters.length
            });

          } else {
            trackActivity('poster_click', {
              animeId: animeId,
              animeTitle: anime ? anime.title : animeId,
              view: view,
              posterVariant: -1,
              posterLabel: 'Main'
            });
          }
        }
      }catch(e){}
      return _origNavigate.apply(window, arguments);
    };
  }
  
  /* Hook 2: Track episode watch progress */
  var _origMarkComplete = window.mbMarkComplete;
  if(_origMarkComplete){
    window.mbMarkComplete = function(animeId, epIdx, dur){
      try{
        if(state.currentUserId){
          var anime = null;
          if(typeof ANIME_DATA !== 'undefined'){
            anime = ANIME_DATA.find(function(a){return a.id === animeId;});
          }
          trackActivity('episode_complete', {
            animeId: animeId,
            animeTitle: anime ? anime.title : animeId,
            epIdx: epIdx,
            duration: dur || 0
          });
        }
      }catch(e){}
      return _origMarkComplete.apply(window, arguments);
    };
  }
  
  /* Hook 3: Track episode progress (position saves) */
  /* The app saves progress in: state.watchProgress[key] = {position, duration, ...} */
  /* We hook into the saveLocal to track progress changes */
  var _lastProgressTrack = {};
  setInterval(function(){
    try{
      if(!state.currentUserId || !state.watchProgress) return;
      Object.keys(state.watchProgress).forEach(function(key){
        var p = state.watchProgress[key];
        if(!p || !p.animeId) return;
        var lastTracked = _lastProgressTrack[key] || 0;
        var now = Date.now();
        /* Track progress every 2 seconds per episode */
        if(now - lastTracked > 2000 && p.position > 0){
          _lastProgressTrack[key] = now;
          var anime = null;
          if(typeof ANIME_DATA !== 'undefined'){
            anime = ANIME_DATA.find(function(a){return a.id === p.animeId;});
          }
          var pct = p.duration > 0 ? Math.round((p.position / p.duration) * 100) : 0;
          trackActivity('episode_progress', {
            animeId: p.animeId,
            animeTitle: anime ? anime.title : p.animeId,
            epIdx: p.epIdx,
            position: p.position,
            duration: p.duration,
            percent: pct,
            completed: p.completed || false
          });
        }
      });
    }catch(e){}
  }, 2000);
  
  /* Expose to global for admin panel */
  window.MBTrack = {
    track: trackActivity,
    getAll: function(){
      return state.userActivity || [];
    },
    getByUser: function(userId){
      return (state.userActivity || []).filter(function(a){return a.userId === userId;});
    },
    getByType: function(type){
      return (state.userActivity || []).filter(function(a){return a.type === type;});
    },
    clearAll: function(){
      state.userActivity = [];
      try{ localStorage.removeItem('mb_user_activity'); }catch(e){}
      if(typeof cloudReady !== 'undefined' && cloudReady && typeof db !== 'undefined' && db && state.currentUserId){
        db.collection('user_activity').doc(state.currentUserId).delete().catch(function(){});
      }
    }
  };
  
  console.log('[MBTrack] Activity tracking online (silent, cloud-synced)');
});
</script>


<script>
/* === Multi-Poster + Genre-Based Recommendations === */
window.addEventListener('load', function(){
  if(window._mbposters) return;
  window._mbposters = true;

  /* --- Multi-poster support --- */
  /* Anime objects can have: posters: ["url1","url2","url3","url4"] */
  /* posterHTML function is enhanced to cycle through available posters */
  
  var _origPosterHTML = window.posterHTML;
  if(_origPosterHTML){
    window.posterHTML = function(e, size){
      try{
        /* If anime has multiple posters, pick one based on user preference or random */
        if(e && e.posters && Array.isArray(e.posters) && e.posters.length > 0){
          var validPosters = e.posters.filter(function(p){return p && p.trim();});
          if(validPosters.length > 0){
            /* Pick poster based on user's preferred genre */
            /* Poster categories: 0=Romance, 1=Action, 2=Family, 3=School */
            var genreToPoster = {'Romance':0,'Love life':0,'Love Life':0,'Action':1,'Family':2,'School':3,'Slice of Life':3,'Comedy':3};
            var userGenre = null;
            try{
              if(typeof state!=='undefined'&&state.viewHistory&&state.viewHistory.length>0){
                var gCount={};
                state.viewHistory.forEach(function(v){
                  var a=ANIME_DATA.find(function(x){return x.id===v.animeId;});
                  if(a&&a.genres){a.genres.forEach(function(g){gCount[g]=(gCount[g]||0)+1;});}
                });
                var sorted=Object.keys(gCount).sort(function(a,b){return gCount[b]-gCount[a];});
                if(sorted.length>0)userGenre=sorted[0];
              }
            }catch(e){}
            var posterIdx=0;
            if(userGenre&&genreToPoster[userGenre]!==undefined){posterIdx=genreToPoster[userGenre];}
            if(posterIdx>=validPosters.length)posterIdx=0;
            var url=validPosters[posterIdx];
            /* Apply size transformation like original */
            var sz = size || 'w500';
            url = url.replace('/w1280/','/'+sz+'/').replace('/w780/','/'+sz+'/').replace('/w500/','/'+sz+'/').replace('/w342/','/'+sz+'/');
            return '<img src="'+url+'" style="display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#111;" loading="lazy" onerror="handlePosterError(this,\''+e.id+'\')"/>';
          }
        }
      }catch(err){}
      /* Fallback to original */
      return _origPosterHTML.apply(window, arguments);
    };
  }

  /* --- Genre-based recommendations on home page --- */
  /* After render, inject personalized genre sections */
  
  var GENRE_SECTIONS = [
    {key:'Romance', label:'Love & Romance', icon:'', color:'#f04848'},
    {key:'Action', label:'Action Anime', icon:'', color:'#ff6a00'},
    {key:'Comedy', label:'Comedy Anime', icon:'', color:'#ffc83d'},
    {key:'Fantasy', label:'Fantasy World', icon:'', color:'#9b7fff'},
    {key:'Sci-Fi', label:'Sci-Fi Anime', icon:'', color:'#4d9fff'}
  ];

  /* Get user's preferred genres based on viewing history */
  function getUserPreferredGenres(){
    try{
      if(typeof state === 'undefined' || !state.viewHistory) return [];
      var genreCount = {};
      state.viewHistory.forEach(function(v){
        var anime = ANIME_DATA.find(function(a){return a.id === v.animeId;});
        if(anime && anime.genres){
          anime.genres.forEach(function(g){
            genreCount[g] = (genreCount[g] || 0) + 1;
          });
        }
      });
      /* Sort genres by count */
      return Object.keys(genreCount).sort(function(a,b){return genreCount[b] - genreCount[a];});
    }catch(e){return [];}
  }

  /* Build genre-based section HTML */
  function buildGenreSection(genre){
    try{
      var animeList = ANIME_DATA.filter(function(a){
        return !a.hidden && a.genres && a.genres.indexOf(genre) >= 0;
      });
      if(animeList.length === 0) return '';
      
      var section = GENRE_SECTIONS.find(function(s){return s.key === genre;});
      var label = section ? section.label : genre;
      var icon = section ? section.icon : '';
      var color = section ? section.color : '#ff6a00';
      
      var h = '<div class="hscroll-section" id="genre-'+genre.replace(/\s/g,'')+'">';
      h += '<div class="hscroll-header"><div><div class="hscroll-label">For You</div>';
      h += '<div class="hscroll-title" style="color:#fff">'+label+'</div></div><span class="hscroll-link" onclick="state.filterGenre=\''+genre+'\';navigate(\'browse\')" style="white-space:nowrap">View All</span></div>';
      h += '<div class="hscroll-track">';
      
      animeList.slice(0, 12).forEach(function(a, i){
        var poster = posterHTML(a);
        var rating = a.reviewCount > 0 ? '&#9733; ' + a.weightedScore : '&#9733; &#8212;';
        h += '<div class="hscroll-card" onclick="navigate(\'anime\',\''+a.id+'\')">';
        h += '<div class="hscroll-card__poster">'+poster;
        h += '<div class="hscroll-card__rating">'+rating+'</div></div>';
        h += '<div class="hscroll-card__title">'+a.title+'</div>';
        h += '<div class="hscroll-card__meta">'+a.year+' &#183; '+a.episodes+' ep</div></div>';
      });
      
      h += '</div></div>';
      return h;
    }catch(e){return '';}
  }

  /* Inject genre sections into home page after render */
  var _origRender = window.render;
  if(_origRender){
    window.render = function(){
      _origRender.apply(window, arguments);
      /* After render, inject genre sections on home page */
      try{
        if(typeof state !== 'undefined' && state.view === 'home'){
          var app = document.getElementById('app');
          if(!app) return;
          var existing = document.getElementById('mbGenreSections');
          if(existing) existing.remove();
          
          var preferred = getUserPreferredGenres();
          var sections = [];
          
          /* Show user's top 4 preferred genres first */
          var shownGenres = [];
          preferred.slice(0, 4).forEach(function(g){
            if(GENRE_SECTIONS.find(function(s){return s.key === g;})){
              shownGenres.push(g);
            }
          });
          /* Fill remaining with default genres */
          GENRE_SECTIONS.forEach(function(s){
            if(shownGenres.indexOf(s.key) < 0 && shownGenres.length < 6){
              shownGenres.push(s.key);
            }
          });
          
          /* Build sections */
          var html = '<div id="mbGenreSections" style="margin-top:28px;">';
          html += '<div style="text-align:center;margin-bottom:24px;padding:20px 16px;background:linear-gradient(135deg,rgba(255,122,26,0.08),rgba(255,122,26,0));border-radius:16px;"><div style="font-size:12px;font-weight:600;color:#fff;opacity:0.6;letter-spacing:1.5px;text-transform:uppercase;">Recommended For You</div><div style="font-size:22px;font-weight:700;color:#fff;margin-top:6px;">Based on Your Taste</div></div>';
          shownGenres.forEach(function(g){
            html += buildGenreSection(g);
          });
          html += '<div style="text-align:center;padding:20px 16px 8px;"><button onclick="navigate(\'browse\')" style="background:var(--accent);color:#fff;border:none;border-radius:24px;padding:14px 48px;font-size:15px;font-weight:600;font-family:var(--font-display);cursor:pointer;box-shadow:0 4px 16px rgba(255,106,0,.3);">View All</button></div>';
          html += '</div>';
          
          /* Insert before the end of app content */
          app.insertAdjacentHTML('beforeend', html);
        }
      }catch(e){}
    };
  }

  console.log('[MBPosters] Multi-poster + genre recommendations online');
});
</script>


<script>
/* === Social Share Function === */
function mbShare(platform){
  var url=window.location.href;
  var title='Check out MoonBright - Watch Anime Online Free in HD!';
  var text='Watch anime online free in HD on MoonBright. Stream latest anime episodes, movies, Hindi dubbed and English dubbed anime.';
  if(platform==='wa'){
    window.open('https://wa.me/?text='+encodeURIComponent(title+' '+url),'_blank');
  }else if(platform==='tg'){
    window.open('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(title),'_blank');
  }else if(platform==='cp'){
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){
        var btn=event.target.closest('.mb-share-btn');
        var original=btn.innerHTML;
        btn.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#25d366"/></svg>';
        setTimeout(function(){btn.innerHTML=original;},2000);
      });
    }else{
      var ta=document.createElement('textarea');
      ta.value=url;document.body.appendChild(ta);ta.select();
      document.execCommand('copy');document.body.removeChild(ta);
      alert('Link copied!');
    }
  }
}
</script>
